<!DOCTYPE html>
<html lang="es">
<head>

  <title>Una cancion especial para ti </title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;

      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      font-family: system-ui, -apple-system, sans-serif;

      text-align: center;
      padding: 20px;

    .card {

      width: 100%;

    h1 {
      margin-bottom: 0.5rem;
      color: #d81b60;
      font-size: 1.6rem;
    }

    p {
      margin-bottom: 1.5rem;
      color: #666;
      line-height: 1.5;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 30px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Te amo corazon <3</h1>
    <p>Dale play para escuchar:</p>

    <!-- La ruta relativa apunta al archivo en tu repo -->
